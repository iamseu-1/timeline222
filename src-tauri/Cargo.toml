[package]
name = "app"
version = "0.0.4"
description = "역사 연표 — 동아시아사를 한눈에 보는 연표 (Tauri 앱)"
authors = ["history-timeline"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# 아이패드: 화면(WKWebView)의 뒤로 밀기를 켜는 한 줄(src/lib.rs) — tauri가 이미 쓰는 것과 같은 판
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
