<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>역사 연표</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<!-- 연표: 보기 전용입니다 — 고치는 것은 DLC 메이커(dlc-maker.html: 같은 화면 + 편집기 + 메이커 줄)에서. 두 화면은 js/viewer.js를 함께 쓰고 data-app으로 갈립니다 -->
<body data-app="view">
  <div class="app">
    <!-- 맨 위 줄(독): 보고 있는 연도 · 검색 · 기호만 둔 단추(집합 보기 · 필터 · 렌즈 · 더 보기 — 이름은 풍선에만, 건의 8 감독 선택 2026-10-13 '1. A · 가'). 선 아이콘은 js/viewer.js의 HT.icon이 data-icon 자리에 채움 -->
    <div class="dock" id="dock">
      <span class="dock-range" id="viewRange" title="지금 보고 있는 시기"></span>
      <div class="search" role="search">
        <input id="searchInput" type="search" autocomplete="off" aria-label="검색 — 이름·연도·날짜·간지" title="이름·연도·날짜·간지로 찾기 (/)">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <div class="dock-actions">
        <button id="viewsBtn" class="dock-btn views-btn" type="button" aria-expanded="false" aria-controls="viewsPop" aria-label="집합 보기" title="집합 보기" data-icon="layers" hidden></button>
        <button id="filterToggle" class="dock-btn" type="button" aria-expanded="false" aria-controls="filterbar" aria-label="필터와 표시 설정" title="필터 (F)" data-icon="menu"></button>
        <!-- 렌즈(주제 보기): 지도자 칸 자리에 주제의 칸 — 단추 · 차림표 · 단축키 S는 js/lens-ui.js가 붙임 (설계 docs/설계-10건/7-8-단체와-렌즈.md 결정 6 B) -->
        <button id="themeLensBtn" class="dock-btn lens-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="렌즈 차림표" title="렌즈 (S)" data-icon="eye"></button>
        <button id="menuBtn" class="dock-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="더 보기 — 모든 기능과 단축키 (연표 위에서 오른쪽 클릭으로도 열림)" title="더 보기" data-icon="more"></button>
        <div id="hiddenActions" hidden>
          <button id="dlcBtn" class="btn" type="button" data-icon="package">DLC 관리</button>
        </div>
      </div>
    </div>
    <div class="status-pill" id="statusPill" hidden><span id="measureInfo" class="measure-info" hidden></span></div>
    <p id="packSummary" hidden></p>
    <button id="zenExit" class="zen-exit" type="button" hidden title="창 다시 보이기 (Z)">☰</button>
    <div id="ctxMenu" class="ctx-menu" role="menu" hidden></div>

    <div class="filterbar" id="filterbar">
      <div class="filter-group"><span class="filter-title">트랙</span><div id="trackChips" class="chips"></div><button id="foldAllBtn" class="btn btn-sm" type="button" title="모든 트랙을 접거나 펼칩니다 (A)">모두 접기</button></div>
      <div class="filter-group"><span class="filter-title">분류</span><div id="categoryChips" class="chips"></div></div>
      <div class="filter-group" id="kindGroup" hidden><span class="filter-title">종류</span><div id="kindChips" class="chips"></div></div>
      <div class="filter-group" id="historicityGroup" hidden><span class="filter-title">실재성</span><div id="historicityChips" class="chips"></div></div>
      <div class="filter-group" id="scopeGroup" hidden title="누르면 모아 보기를 켜고 끕니다 — 구성 정권이 한 가지로 모임"><span class="filter-title">대범위</span><div id="scopeChips" class="chips"></div></div>
      <!-- 표시 체크: 무엇을 켜고 끄는지에 따라 세 묶음 (띠 안 · 날짜 칸 · 선·견해) -->
      <div class="filter-shows">
        <div class="filter-group filter-show" role="group" aria-label="띠 안에 보이는 것">
          <span class="filter-title">띠 안</span>
          <label class="check" title="띠 맨 위에 왕조 칸을 보여 줍니다 (왕조를 적은 나라만)"><input id="dynastyToggle" type="checkbox" checked> 왕조</label>
          <label class="check" title="띠 위쪽에 지도자 칸을 보여 줍니다"><input id="leaderToggle" type="checkbox" checked> 지도자</label>
          <select id="leaderLabelSelect" aria-label="지도자 표기" title="지도자 칸에 묘호·시호·이름 중 무엇을 적을지"></select>
          <label class="check" title="지도자 이름 앞에 '4대'처럼 대수를 붙입니다"><input id="ordinalToggle" type="checkbox"> 대수</label>
          <label class="check" title="지도자 칸 아래에 내각 칸을 보여 줍니다"><input id="cabinetToggle" type="checkbox" checked> 내각</label>
          <label class="check" title="띠 안 지도자 칸 위에 후대 학계의 시기 구분(체계마다 얇은 줄)을 보여 줍니다 — 날짜 칸의 '시대 구분'과는 다른 것입니다. '빽빽하게' · '조감'에서는 숨습니다"><input id="phaseToggle" type="checkbox" checked> 시기</label>
          <label class="check" title="지위(공 · 왕 · 황제 …)가 바뀐 나라는 띠 안 지도자 칸 위에 지위 단을, 지위가 하나뿐인 나라는 책갈피 탭에 작은 딱지를 보여 줍니다. '빽빽하게' · '조감'에서는 지위 단이 숨습니다"><input id="rankToggle" type="checkbox" checked> 지위</label>
          <label class="check" title="띠 안 지도자 칸 위에 그때 집권한 단체와 실권을 쥔 집단의 칸을, 띠 위 탭 줄에 연합의 겹 탭을 보여 줍니다 (단체를 적은 나라만). '빽빽하게' · '조감'에서는 칸이 숨습니다"><input id="groupToggle" type="checkbox" checked> 단체</label>
          <label class="check" title="띠 안, 기간 막대 아래에 그 나라에서 활동한 인물의 활동 막대를 보여 줍니다 (중요도 필터를 따름)"><input id="figureToggle" type="checkbox" checked> 인물</label>
          <label class="check" title="지도자 칸 아래쪽에 그 지도자의 가문 색 줄을 긋습니다 (같은 가문이 이어지는 동안 한 줄)"><input id="houseToggle" type="checkbox"> 가문</label>
        </div>
        <div class="filter-group filter-show" role="group" aria-label="맨 위 날짜 칸에 보이는 것">
          <span class="filter-title">날짜 칸</span>
          <label class="check" title="맨 위 날짜 칸에 간지(육십갑자) 줄을 보여 줍니다"><input id="ganjiToggle" type="checkbox" checked> 간지</label>
          <label class="check" title="맨 위 날짜 칸에 연호 묶음 줄을 보여 줍니다 (묶음 이름을 누르면 나라별로 펼침)"><input id="eraToggle" type="checkbox" checked> 연호</label>
          <label class="check" title="맨 위 날짜 칸에 도읍 묶음 줄을 보여 줍니다 (묶음 이름을 누르면 나라별로 펼침)"><input id="capToggle" type="checkbox" checked> 도읍</label>
          <label class="check" title="맨 위 날짜 칸에 나라별 시대 구분 띠를 보여 줍니다"><input id="epochToggle" type="checkbox" checked> 시대 구분</label>
        </div>
        <div class="filter-group filter-show" role="group" aria-label="선과 다른 견해">
          <span class="filter-title">선·견해</span>
          <label class="check" title="건국·멸망 네모를 잇는 승계선(직접 실선 · 간접 점선)을 보여 줍니다"><input id="linkToggle" type="checkbox" checked> 승계선</label>
          <label class="check" title="연맹의 구성국·종속국·조직체를 상위 정권과 잇는 세로 점선을 보여 줍니다"><input id="partToggle" type="checkbox" checked> 소속선</label>
          <label class="check" title="학자·사료마다 다른 연대를 함께 표시합니다 — 사건 · 시대의 점선 표식, 칸의 유령 구분선(칸을 누르면 그 이설 기간도)"><input id="altToggle" type="checkbox" checked> 이설</label>
          <label class="check" title="칸(지도자 · 내각 · 연호 · 도읍 · 왕조 · 시기 · 지위)이나 인물을 골라 그 기간이 조명될 때, 그때 있던 타국의 띠도 그 기간만큼은 흐리지 않고 조명과 같은 짙기로 칠하며, 그 시기 타국의 사건도 밝게 남깁니다 (창에는 나라별 목록)"><input id="spotEchoToggle" type="checkbox"> 같은 시기를 타국에도</label>
        </div>
      </div>
      <div class="filter-group filter-options">
        <select id="importanceSelect" aria-label="중요도 필터">
          <option value="1">모든 사건</option>
          <option value="2">보통 이상</option>
          <option value="3">중요 사건만</option>
        </select>
        <span class="filter-sub">관점</span>
        <select id="lensSelect" aria-label="관점" title="같은 사건을 어느 나라의 이름으로 보여 줄지 고릅니다">
          <option value="">기본</option>
          <option value="local">나라마다 제 이름</option>
        </select>
        <select id="densitySelect" aria-label="띠 밀도" title="정권 띠의 높이와 글자 크기 — 조감은 줄을 띠 하나 높이로 줄여 모든 나라를 한눈에 (V)">
          <option value="-1">넉넉하게</option>
          <option value="0" selected>자동</option>
          <option value="1">빽빽하게</option>
          <option value="2">조감</option>
        </select>
        <span class="filter-sub">조감</span>
        <select id="birdShapeSelect" aria-label="조감 모양" title="조감에서 띠 안에 남길 것 — 이름과 사건 점(기본) · 이름만 · 띠와 선만(가장 낮게 · 이름은 띠에 올리면)">
          <option value="a" selected>이름 + 점</option>
          <option value="b">이름만</option>
          <option value="c">띠 · 선만</option>
        </select>
        <label class="check" title="가로로 많이 축소하면(보기 폭 2,600년 이상 — 사건 이름이 모두 꺼지는 넓이) 저절로 조감으로, 다시 확대하면 고른 밀도로 돌아옵니다. 조감을 ↕ · V로 풀면 다시 확대할 때까지 쉽니다"><input id="birdAutoToggle" type="checkbox"> 축소하면 조감</label>
        <span class="tool-sep"></span>
        <button id="yearBtn" class="btn btn-sm" type="button" title="한 해에 여러 나라에서 무슨 일이 있었는지 봅니다 (Y)" data-icon="pin">같은 해</button>
        <button id="measureBtn" class="btn btn-sm" type="button" aria-pressed="false" title="드래그해서 두 시점 사이 기간을 잽니다 — 가까이 확대하면 개월·일까지 (R)" data-icon="ruler">기간 재기</button>
        <button id="tableBtn" class="btn btn-sm" type="button" title="표 (T)" data-icon="table">표</button>
        <button id="imageBtn" class="btn btn-sm" type="button" title="이미지 · 인쇄 (P)" data-icon="image">이미지 · 인쇄</button>
        <button id="legendBtn" class="btn btn-sm" type="button" aria-pressed="false" title="띠·점·선 모양이 뜻하는 것 (L)" data-icon="help">범례</button>
      </div>
    </div>

    <main class="stage" id="stage">
      <div id="timeline" class="timeline-host"></div>
      <aside id="legend" class="legend" hidden aria-label="범례"></aside>

      <div class="zoom-controls" role="group" aria-label="확대/축소">
        <button class="icon-btn" data-zoom="in" type="button" title="확대 (+)" aria-label="확대" data-icon="plus"></button>
        <button class="icon-btn" data-zoom="out" type="button" title="축소 (-)" aria-label="축소" data-icon="minus"></button>
        <button class="icon-btn" data-zoom="fit" type="button" title="전체 보기 (0)" aria-label="전체 보기" data-icon="expand"></button>
        <button class="icon-btn" id="birdBtn" data-zoom="bird" type="button" aria-pressed="false" title="조감 (V)" aria-label="조감" data-icon="bird"></button>
      </div>

      <aside id="detail" class="detail" hidden aria-live="polite"></aside>

      <!-- 위키 문서 -->
      <section id="wikiPane" class="wiki-pane" hidden aria-label="위키 문서">
        <div class="wiki-head">
          <button id="wikiBack" class="icon-btn" type="button" data-wiki-act="back" title="이전 문서">←</button>
          <div class="wiki-titles"><h2 id="wikiTitle"></h2><span id="wikiMeta" class="wiki-meta"></span></div>
          <button id="wikiGoto" class="btn btn-sm" type="button" data-wiki-act="goto" title="연표에서 이 항목으로" data-icon="zoom-in">연표에서</button>
          <button class="icon-btn" type="button" data-wiki-act="close" aria-label="닫기">✕</button>
        </div>
        <div id="wikiSubs" class="wiki-subs" hidden></div>
        <div id="wikiBody" class="wiki-body">
          <nav id="wikiToc" class="wiki-toc wk"></nav>
          <article id="wikiArticle" class="wiki-article wk"></article>
        </div>
      </section>
    </main>
  </div>

  <!-- DLC 관리 -->
  <dialog id="dlcDialog" class="dlc-dialog">
    <div class="dlg">
      <div class="dlg-head"><h2>DLC 관리</h2><button class="icon-btn" data-close aria-label="닫기">✕</button></div>
      <div class="dlg-body" id="dlcBody"></div>
    </div>
  </dialog>

  <!-- 표로 보기 -->
  <dialog id="tableDialog" class="dlc-dialog">
    <div class="dlg">
      <div class="dlg-head"><h2>표</h2><button class="icon-btn" data-close aria-label="닫기">✕</button></div>
      <div class="dlg-body" id="tableBody"></div>
      <div class="dlg-foot">
        <label class="check"><input id="tableRangeOnly" type="checkbox"> 지금 보이는 시기만</label>
        <label class="check"><input id="tablePeriods" type="checkbox"> 시대 · 인물도 포함</label>
        <span class="spacer"></span>
        <button class="btn" id="csvBtn" type="button" data-icon="download">CSV로 내보내기</button>
        <button class="btn" data-close type="button">닫기</button>
      </div>
    </div>
  </dialog>

  <!-- 이미지·인쇄 -->
  <dialog id="imageDialog">
    <div class="dlg">
      <div class="dlg-head"><h2>이미지 · 인쇄</h2><button class="icon-btn" data-close aria-label="닫기">✕</button></div>
      <div class="dlg-body">
        <p class="lead">지금 보고 있는 시기와 필터 그대로, 모든 트랙을 한 장에 담아 그림으로 만듭니다.</p>
        <div class="form-grid">
          <label class="field"><span>가로 크기</span><select id="imgWidth"><option value="1200">1200px</option><option value="1800" selected>1800px</option><option value="2600">2600px (고화질)</option><option value="3600">3600px (인쇄용)</option></select></label>
          <label class="field"><span>제목 <small>(그림 위에 적힙니다)</small></span><input id="imgTitle" maxlength="60"></label>
        </div>
      </div>
      <div class="dlg-foot">
        <button class="btn" id="printBtn" type="button" data-icon="printer">인쇄</button>
        <span class="spacer"></span>
        <button class="btn" id="svgBtn" type="button">SVG 저장</button>
        <button class="btn btn-primary" id="pngBtn" type="button">PNG 저장</button>
      </div>
    </div>
  </dialog>

  <div id="dropOverlay" class="drop-overlay" hidden><div>📦 여기에 놓으면 DLC를 설치합니다</div></div>

  <script src="js/calendar.js"></script>
  <script src="js/core.js"></script>
  <script src="js/wiki.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/packfile.js"></script>
  <script src="packs/east-asia/pack.js"></script>
  <script src="packs/east-asia/korea-1.js"></script>
  <script src="packs/east-asia/korea-2.js"></script>
  <script src="packs/east-asia/china-1.js"></script>
  <script src="packs/east-asia/china-2.js"></script>
  <script src="packs/east-asia/japan.js"></script>
  <script src="packs/east-asia/vietnam.js"></script>
  <script src="packs/east-asia/north.js"></script>
  <script src="packs/east-asia/relations.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/kin-view.js"></script>
  <script src="js/views-ui.js"></script>
  <script src="js/group-tree.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/lens-ui.js"></script>
</body>
</html>
